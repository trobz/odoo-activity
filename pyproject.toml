[project]
name = "odoo-activity"
version = "0.21.0"
description = "The odoo ops toolbox, for you (TUI) and your agent (MCP)"
authors = [{name = "trobz", email = "contact@trobz.com"}]
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0"
license-files = ["LICENSE"]

dependencies = [
    "typer>=0.20",
    "textual>=8",
    "typing-extensions>=4.16",
    "mcp[cli]>=1.28.1,<2.0.0",
    "pyperclip>=1.11.0",
    "requests>=2.32",
]

[project.urls]
Repository = "https://github.com/trobz/odoo-activity"
[project.entry-points."odoo_activity.plugins"]
odooly = "odoo_activity.plugins.odooly:OdoolyPlugin"

# the bundled managers come through the same door a third-party one would
[project.entry-points."odoo_activity.managers"]
systemd = "odoo_activity.managers.systemd:SystemdManager"
supervisor = "odoo_activity.managers.supervisor:SupervisorManager"
odoosh = "odoo_activity.managers.odoosh:OdooshManager"
docker = "odoo_activity.managers.docker:DockerManager"
local = "odoo_activity.managers.local:LocalManager"

[project.scripts]
odoo-activity = "odoo_activity.main:app"
oa = "odoo_activity.main:app"
oa-mcp = "odoo_activity.mcp_server:app"
oa-mcp-multi = "odoo_activity.mcp_server:app_multi"

[dependency-groups]
dev = [
    "pre-commit>=2.20.0",
    "ty>=0.0.1a16",
    "ruff>=0.11.5",
    "pytest>=7.2.0",
    "pytest-xdist>=3.6",
    # a runtime extra, but not an optional one for the suite: the bundled
    # odooly plugin's tests import it, and skipping them when it is absent
    # would quietly stop testing the plugin at all
    "odooly>=2.6",
    "python-semantic-release>=10.5.3",
    "zensical>=0.0.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the TUI tests each spin up their own Textual app and are independent, so
# the suite is worth spreading across cores rather than serialising
addopts = "-n auto"


[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "odoo_activity"
module-root = ""


[project.optional-dependencies]
build = ["uv ~= 0.7.12"]
mcp = []
odooly = ["odooly>=2.6"]
# hand-maintained: a new bundled plugin needs its own extra above and a
# mention here, and this can only reach plugins shipped with odoo-activity
all = ["odoo-activity[odooly]"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
  python -m pip install -e '.[build]'
  uv lock --upgrade-package odoo-activity
  git add uv.lock
  uv build
"""

# Commit parser - this should be at the top level
commit_parser = "conventional"

# Allow 0.x.x versions (prevents jumping straight to 1.0.0)
allow_zero_version = true

# Don't do major version bumps when in 0.x.x
major_on_zero = false

# Tag format
tag_format = "v{version}"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''initial commit.*''',
]
